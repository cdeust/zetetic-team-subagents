# .craftsmanship.conf — per-repo craftsmanship tuning.
# Source: tools/craftsmanship-checker.sh; loaded after env defaults (overrides).
#
# §4.1 test-file exception (fixture-grouping exception):
# "test files may exceed §4.1 (500 lines) if organized by fixture grouping."
# The mutation-strong suites under tests/ are organized by API entry-point, not
# by concern count. Splitting them into per-function files would replicate shared
# fixtures (_valid_entry, _FakeArgs, conftest helpers) across every shard —
# increasing coupling, not reducing it. Concrete cases: tests/test_semantic_layer.py
# (15 public API entry-points, 162 tests) and tests/test_manifest_gate.py (70 tests).
#
# This raises the file-size ceiling ONLY for files matching the checker's
# TEST_FILE_RE; production source files remain bound by FILE_MAX=500 (the global
# limit is NOT touched), so a runaway production god-file is still caught.
TEST_FILE_MAX=2000
