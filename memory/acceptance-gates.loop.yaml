# acceptance-gates.loop.yaml — diff-scoped gate config for the autonomous build loop.
#
# Same schema as memory/acceptance-gates.yaml, but the gates use the {files} token
# and the loop runs them with --diff-base <integration> --diff-head <iter-N>. The
# tool computes the changed files of that commit range, substitutes {files}, and
# REJECTS an empty diff — so a no-op iteration cannot pass vacuously, and the gate
# scope is tool-owned (computed from git) rather than chosen by the builder via
# staging. The loop appends the contract's deterministic checkable_cmd criteria as
# origin:contract gates before running this config.
#
# Why a separate file from acceptance-gates.yaml: that one is for standalone/manual
# runs (scopes to the staged diff); this one is for the loop (scopes to a commit
# range). Both are committed and deterministic; neither is assembled by a model.

version: 1
gates:
  - name: zetetic-sources
    # §8 source discipline over exactly the files this iteration changed.
    cmd: "ZETETIC_PROFILE=standard bash tools/zetetic-checker.sh --files {files}"
    mandatory: true
    origin: base

  - name: agent-definitions
    cmd: "bash tools/agent-definition-auditor.sh"
    mandatory: true
    origin: base

  - name: tests-manifest-gate
    cmd: "bash tools/tests/manifest-gate/run-tests.sh"
    mandatory: true
    origin: base

  - name: tests-acceptance-gate
    cmd: "bash tools/tests/acceptance-gate/run-tests.sh"
    mandatory: true
    origin: base

  - name: tests-mutation-gate
    # Gates the mutation-gate wrapper itself (proportional contract: PASS on
    # non-applicable, BLOCK only on survivors, degrade on no-runner). Like the
    # self-tests above, this keeps the gate component from silently breaking.
    cmd: "bash tools/tests/mutation-gate/run-tests.sh"
    mandatory: true
    origin: base

  - name: mutation-test-strength
    # Test-strength over exactly the files this iteration changed (§12.4): the
    # suite must KILL mutants, not just cover lines. tools/mutation-gate.sh wraps
    # the scoped runner (tools/mutation_check.sh) so the loop never freezes on
    # non-code or tool-less iterations: PASS when no mutation-applicable source
    # changed; BLOCK only on a surviving mutant; degrade LOUDLY (warn, pass) when
    # no runner is configured (coding-standards.md section 12). The authoritative
    # external check stays the human/CI re-gate (INV-2). source: coding-standards §12.
    cmd: "bash tools/mutation-gate.sh {files}"
    mandatory: true
    origin: base
