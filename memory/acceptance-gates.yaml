# acceptance-gates.yaml — CONFIG for tools/acceptance-gate.sh
#
# The deterministic half of the autonomous build loop's whole-task acceptance
# gate. Each entry is a command whose EXIT CODE is the gate: pass iff it exits 0.
# The gate runner (tools/acceptance_gate.py) makes no judgement of its own — this
# is what keeps the loop's convergence decision external rather than the model
# re-grading itself (arXiv:2310.01798).
#
# Schema:
#   version: 1
#   gates:                       # non-empty list; an empty set fails closed
#     - name:      string        # stable label shown in the verdict (required)
#       cmd:       string        # shell command line, run from the repo root (required)
#       mandatory: bool          # default true; a failed mandatory gate -> rejected
#       origin:    base|contract # provenance; the loop appends origin:contract checks
#
# Accept iff >=1 mandatory gate exists AND every mandatory gate exits 0.
# The loop runs this BASE set, then appends contract-derived checks (origin:
# contract) translated from the refined acceptance contract, and scopes
# zetetic-checker to the task's staged diff.

version: 1
gates:
  - name: zetetic-sources
    # §8 source discipline over the task's staged diff (not the whole tree, so it
    # judges only this iteration's changes). Empty stage -> clean exit 0.
    cmd: "ZETETIC_PROFILE=standard bash tools/zetetic-checker.sh --staged"
    mandatory: true
    origin: base

  - name: agent-definitions
    # Structural auditor for agent definitions; CI runs it as a blocking job.
    cmd: "bash tools/agent-definition-auditor.sh"
    mandatory: true
    origin: base

  - name: tests-manifest-gate
    # A->B membership gate regression suite (milestone 1 bridge).
    cmd: "bash tools/tests/manifest-gate/run-tests.sh"
    mandatory: true
    origin: base

  - name: tests-matrix-selftest
    # Regression suite for tools/test-matrix.sh (the cross-backend test runner).
    # Gates the gate component itself, like tests-manifest-gate above.
    cmd: "bash tools/tests/test-matrix/run-tests.sh"
    mandatory: true
    origin: base

  - name: tests-mutation-gate
    # Gates the mutation-gate wrapper itself (gate-the-gate, like the suites above).
    cmd: "bash tools/tests/mutation-gate/run-tests.sh"
    mandatory: true
    origin: base

  - name: mutation-test-strength
    # §12.4 test-strength over the STAGED diff: the suite must KILL mutants, not
    # just cover lines. tools/mutation-gate.sh wraps the scoped runner
    # (tools/mutation_check.sh) with proportional semantics — PASS when no
    # mutation-applicable source is staged; BLOCK only on a surviving mutant;
    # degrade loudly (warn, pass) when no runner is configured ). source: coding-standards.md §12.
    cmd: "bash tools/mutation-gate.sh --staged"
    mandatory: true
    origin: base

  # --- Cross-backend test gate template (rules/coding-standards.md §12.3) ---
  # A suite green on one backend can hide a defect on another (numpy.float32 on PG
  # vs float on SQLite — green coverage, shipped bug). tools/test-matrix.sh runs the
  # SAME suite under EACH backend and fails closed on any red. Wire it as the repo's
  # `tests` gate where the code serves more than one backend (NOT a blind base gate —
  # this repo has no dual-backend suite, so it stays a template):
  # - name: tests-cross-backend
  #   cmd: "bash tools/test-matrix.sh
  #           --backend sqlite
  #           --backend 'pg:DATABASE_URL=postgresql://localhost:5432/cortex_test;CORTEX_BACKEND=pg'
  #           -- pytest tests_py/"
  #   mandatory: true
  #   origin: base

