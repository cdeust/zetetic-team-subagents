# generated by zetetic-team-subagents render-ci 247a56967a66dc056eed9ddbb704e56b2b311f81
name: Pipeline

# The single CI of docs/superpowers/specs/2026-10-22-single-ci-design.md:
# contract, unit, regression, e2e, environment, install, review, merge on a
# pull request; the same five tests then tag on a push to main. Rendered by
# zetetic-team-subagents `scripts/setup.sh render-ci`: edit the template.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# Git Bash on Windows, so every ci.json command is one shell on the three OS.
defaults:
  run:
    shell: bash

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # source: claude-mods PR45, unit job119805310369 passed with 2.1.306.
  CLAUDE_CODE_VERSION: "2.1.306"

jobs:
  # ci.json first: a missing key or an empty command fails here, before any
  # test runs (design, "Repository contract: ci.json"). The validator is
  # tools/ci_contract.py of zetetic-team-subagents, embedded byte for byte.
  contract:
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.commands.outputs.unit }}
      regression: ${{ steps.commands.outputs.regression }}
      e2e: ${{ steps.commands.outputs.e2e }}
      environment: ${{ steps.commands.outputs.environment }}
      install: ${{ steps.commands.outputs.install }}
      version_file: ${{ steps.commands.outputs.version_file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate ci.json
        run: |
          python3 - "$GITHUB_WORKSPACE" <<'PY'
          #!/usr/bin/env python3
          """ci_contract.py -- validates a repository's ``ci.json`` before any test runs.

          The contract (docs/superpowers/specs/2026-10-22-single-ci-design.md, "Repository
          contract: ci.json"): exactly the keys ``unit``, ``regression``, ``e2e``,
          ``environment`` and ``install``, each a non-empty shell command, plus an
          optional ``version_file`` (decision 9; default ``.claude-plugin/plugin.json``)
          that must exist, read by the ``tag`` job. A missing file, a missing key or an
          empty command fails the pipeline here, with one line per fault, so a step that
          has nothing to run never passes (the design's first anti-goal).

          This file is also embedded verbatim in ``templates/ci/pipeline.yml`` as an inline
          ``python3 -`` step: standard library only, arguments through ``sys.argv``.

          Usage: ``python3 tools/ci_contract.py [repo-root]`` (default: the current
          directory). Exit 0 and the five commands plus ``version_file`` on stdout when
          valid; exit 1 and the faults on stderr otherwise.
          """
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path
          from typing import List

          KEYS = ("unit", "regression", "e2e", "environment", "install")
          VERSION_KEY = "version_file"
          DEFAULT_VERSION_FILE = ".claude-plugin/plugin.json"
          ALLOWED = ", ".join(KEYS + (VERSION_KEY,))


          def _load(root: Path):
              """The parsed document, or the one fault that stops validation."""
              path = root / "ci.json"
              if not path.is_file():
                  return None, "ci.json: missing"
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except (ValueError, UnicodeDecodeError) as exc:
                  return None, f"ci.json: not valid JSON ({exc})"
              if not isinstance(data, dict):
                  return None, "ci.json: must be a JSON object"
              return data, None


          def _version_faults(data: dict, root: Path) -> List[str]:
              value = data.get(VERSION_KEY, DEFAULT_VERSION_FILE)
              if not isinstance(value, str):
                  return [f"{VERSION_KEY}: not a string"]
              if not value.strip():
                  return [f"{VERSION_KEY}: empty path"]
              if not (root / value).is_file():
                  return [f"{VERSION_KEY}: {value} does not exist"]
              return []


          def faults(root: Path) -> List[str]:
              """Every fault of ``root/ci.json``, in key order then unknown keys; empty
              when the file honours the contract."""
              data, fatal = _load(root)
              if fatal:
                  return [fatal]
              found: List[str] = []
              for key in KEYS:
                  if key not in data:
                      found.append(f"{key}: missing")
                  elif not isinstance(data[key], str):
                      found.append(f"{key}: not a string")
                  elif not data[key].strip():
                      found.append(f"{key}: empty command")
              found.extend(f"{key}: unknown key (allowed: {ALLOWED})" for key in data if key not in KEYS + (VERSION_KEY,))
              found.extend(_version_faults(data, root))
              return found


          def main(argv: List[str]) -> int:
              root = Path(argv[0]) if argv else Path(".")
              found = faults(root)
              if found:
                  for line in found:
                      print(line, file=sys.stderr)
                  return 1
              data, _ = _load(root)
              for key in KEYS:
                  print(f"{key}: {data[key]}")
              print(f"{VERSION_KEY}: {data.get(VERSION_KEY, DEFAULT_VERSION_FILE)}")
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          PY

      - name: Export the commands
        id: commands
        run: |
          python3 - <<'PY'
          import json, os, secrets
          data = json.load(open("ci.json", encoding="utf-8"))
          data.setdefault("version_file", ".claude-plugin/plugin.json")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for key, value in data.items():
                  delimiter = "EOF_" + secrets.token_hex(8)
                  out.write(f"{key}<<{delimiter}\n{value}\n{delimiter}\n")
          PY

  # The unit command must leave a Cobertura coverage.xml; the reader is
  # tools/ci_coverage.py of zetetic-team-subagents, embedded byte for byte,
  # and fails the step under 90 % of lines (design, Constraints).
  unit:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the unit command
        env:
          CI_COMMAND: ${{ needs.contract.outputs.unit }}
        run: bash -eo pipefail -c "$CI_COMMAND"

      - name: Enforce the coverage floor
        run: |
          python3 - coverage.xml --min 90 <<'PY'
          #!/usr/bin/env python3
          """ci_coverage.py -- reads a Cobertura report and fails under a line threshold.

          The single CI (docs/superpowers/specs/2026-10-22-single-ci-design.md,
          "Repository contract: ci.json") makes the ``unit`` step produce Cobertura XML
          at ``coverage.xml`` and fails it under 90 % of lines, the same number for the
          eight repositories. The root element's ``line-rate`` (0 to 1) is the figure
          every producer here writes (coverage.py, cargo-llvm-cov, vitest/istanbul), so
          one reader serves all stacks. Decimal arithmetic keeps 0.899 at 89.90, not at
          a binary neighbour of the threshold.

          This file is also embedded verbatim in ``templates/ci/pipeline.yml`` as an inline
          ``python3 -`` step: standard library only, arguments through ``sys.argv``.

          Usage: ``python3 tools/ci_coverage.py coverage.xml [--min 90]``. Exit 0 at or
          above the minimum, 1 under it, 2 when the report is absent or unreadable (an
          unmeasurable coverage is not a pass).
          """
          from __future__ import annotations

          import argparse
          import sys
          import xml.etree.ElementTree as ET
          from decimal import Decimal, InvalidOperation
          from pathlib import Path
          from typing import List

          # source: docs/superpowers/specs/2026-10-22-single-ci-design.md, Constraints
          # ("Coverage threshold: 90 % of lines ... same number for the eight repositories").
          DEFAULT_MIN = Decimal("90")
          # xml.etree stays, not defusedxml: the step must run on a bare runner with the
          # standard library, and the report is written by the repository's own unit
          # command in the same job. ElementTree does not expand external entities
          # (https://docs.python.org/3/library/xml.html#xml-vulnerabilities, "Safe").


          class CoverageError(Exception):
              """The report cannot be read as a Cobertura document with a line-rate."""


          def percent(path: Path) -> Decimal:
              """Line coverage of ``path`` as a percentage with two decimals."""
              if not path.is_file():
                  raise CoverageError(f"{path}: no such file")
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError as exc:
                  raise CoverageError(f"{path}: not well-formed XML ({exc})") from exc
              if root.tag != "coverage":
                  raise CoverageError(f"{path}: root element is <{root.tag}>, not <coverage>")
              raw = root.get("line-rate")
              if raw is None:
                  raise CoverageError(f"{path}: <coverage> has no line-rate attribute")
              try:
                  rate = Decimal(raw)
              except InvalidOperation as exc:
                  raise CoverageError(f"{path}: line-rate {raw!r} is not a number") from exc
              return (rate * 100).quantize(Decimal("0.01"))


          def main(argv: List[str]) -> int:
              parser = argparse.ArgumentParser(description="fail when Cobertura line coverage is under a minimum")
              parser.add_argument("report", type=Path, help="Cobertura XML report")
              parser.add_argument("--min", type=Decimal, default=DEFAULT_MIN, help="minimum percentage of lines (default 90)")
              args = parser.parse_args(argv)
              try:
                  value = percent(args.report)
              except CoverageError as exc:
                  print(exc, file=sys.stderr)
                  return 2
              minimum = args.min.quantize(Decimal("0.01"))
              if value < minimum:
                  print(f"coverage: {value}% of lines, under the minimum {minimum}%")
                  return 1
              print(f"coverage: {value}% of lines, minimum {minimum}%")
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          PY

  regression:
    needs: [contract, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the regression command
        env:
          CI_COMMAND: ${{ needs.contract.outputs.regression }}
        run: bash -eo pipefail -c "$CI_COMMAND"

  e2e:
    needs: [contract, regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the e2e command
        env:
          CI_COMMAND: ${{ needs.contract.outputs.e2e }}
        run: bash -eo pipefail -c "$CI_COMMAND"

  # A bare runner (decision 6): the runner image plus the pinned CLI, nothing
  # else installed by the pipeline. CI_OS and CI_WORK are the contract's
  # two variables for the environment and install commands.
  environment:
    needs: [contract, e2e]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.306

      - name: Scratch directory and OS name
        run: |
          work="$(mktemp -d)"
          if [ "$RUNNER_OS" = Windows ]; then work="$(cygpath -m "$work")"; fi
          case "$RUNNER_OS" in Linux) os=linux ;; macOS) os=macos ;; *) os=windows ;; esac
          { echo "CI_WORK=$work"; echo "CI_OS=$os"; } >> "$GITHUB_ENV"

      - name: Run the environment command
        env:
          CI_COMMAND: ${{ needs.contract.outputs.environment }}
        run: bash -eo pipefail -c "$CI_COMMAND"

  # Fresh HOME and CLAUDE_CONFIG_DIR under the scratch directory: the install
  # command sees a machine that has never run Claude Code.
  install:
    needs: [contract, environment]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.306

      - name: Scratch directory and OS name
        run: |
          work="$(mktemp -d)"
          if [ "$RUNNER_OS" = Windows ]; then work="$(cygpath -m "$work")"; fi
          mkdir -p "$work/home" "$work/claude"
          case "$RUNNER_OS" in Linux) os=linux ;; macOS) os=macos ;; *) os=windows ;; esac
          { echo "CI_WORK=$work"; echo "CI_OS=$os"; } >> "$GITHUB_ENV"

      - name: Run the install command
        env:
          CI_COMMAND: ${{ needs.contract.outputs.install }}
          HOME: ${{ env.CI_WORK }}/home
          USERPROFILE: ${{ env.CI_WORK }}/home
          CLAUDE_CONFIG_DIR: ${{ env.CI_WORK }}/claude
        run: bash -eo pipefail -c "$CI_COMMAND"

  # The bot (design, "The bot step"): runs whether install passed or failed,
  # on same-repo, non-draft pull requests. Dependabot remains out of scope.
  # Claude commits skip duplicate review, but failing tests still need repair.
  # Workflow changes retain the bootstrap skip (design decision 2).
  # Cancellation stops mutation; ordinary failed tests still reach repair.
  review:
    needs: [unit, regression, e2e, environment, install]
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request'
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Review guard
        id: guard
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          TEST_RESULTS: ${{ toJSON(needs) }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::The branch advanced after this run started; use its new run."
            exit 1
          fi
          changed="$(git diff --name-only "origin/$BASE_REF...$HEAD_SHA")"
          author="$(git log -1 --format=%ae "$HEAD_SHA")"
          review=true
          fix=true
          if grep -qx '.github/workflows/pipeline.yml' <<<"$changed"; then
            review=false
            fix=false
            echo "## Review: bootstrap workflow change, bot steps skipped" >> "$GITHUB_STEP_SUMMARY"
          else
            case "$author" in
              *'+claude[bot]@users.noreply.github.com'|'claude[bot]@users.noreply.github.com')
                review=false
                fix="$(jq -r 'any(.[]; .result != "success")' <<<"$TEST_RESULTS")"
                echo "## Review: Claude head; duplicate review skipped, repair=$fix" >> "$GITHUB_STEP_SUMMARY"
                ;;
            esac
          fi
          { echo "review=$review"; echo "fix=$fix"; } >> "$GITHUB_OUTPUT"

      - name: Collect the failed jobs of this run
        id: failed
        if: steps.guard.outputs.fix == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "list<<EOF_JOBS"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion == "failure") | "- \(.name): \(.html_url)"'
            echo "EOF_JOBS"
          } >> "$GITHUB_OUTPUT"

      # The documented review (https://code.claude.com/docs/en/github-actions,
      # "Run a skill"): read-only, findings as inline comments.
      - name: Review
        if: steps.guard.outputs.review == 'true'
        uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          allowed_bots: "claude[bot],chatgpt-codex-connector[bot]"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'

      # The fix: every review finding and every failed job, on the branch.
      # Its push is a synchronize event; the five tests run again on it.
      - name: Fix
        if: steps.guard.outputs.fix == 'true'
        uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        with:
          allowed_bots: "claude[bot],chatgpt-codex-connector[bot]"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You own pull request #${{ github.event.pull_request.number }} of ${{ github.repository }}
            (branch ${{ github.event.pull_request.head.ref }}, checked out here).
            1. Read every review comment on the pull request (gh pr view --comments, gh api for inline comments) and apply each finding.
            2. Fix every failed job of pipeline run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}:
            ${{ steps.failed.outputs.list }}
            Read each job's log (gh run view ${{ github.run_id }} --log-failed) and correct the product, not the pipeline.
            3. Run the tests you touched, commit on this branch with a message that names what was fixed, and git push.
            Change nothing when there is nothing to fix. Never edit .github/workflows/pipeline.yml.
          claude_args: >-
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(gh:*),Bash(python3:*),Bash(python:*),Bash(pytest:*),Bash(uv:*),Bash(uvx:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(cargo:*),Bash(bash:*)"

  # Decision 4, hardened after claude-mods #38 and session-optimizer #73 merged
  # on a red pipeline: GitHub treats a skipped required check as satisfied, so
  # merge runs even after failure on a non-cancelled same-repo PR, and fails if a
  # test job did not succeed or the review was incomplete. No checkout: arming
  # auto-merge needs only the workflow token (decision 1 applies to tag).
  merge:
    needs: [contract, unit, regression, e2e, environment, install, review]
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request'
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require completed tests and review
        env:
          CONTRACT: ${{ needs.contract.result }}
          ACTOR: ${{ github.actor }}
          UNIT: ${{ needs.unit.result }}
          REGRESSION: ${{ needs.regression.result }}
          E2E: ${{ needs.e2e.result }}
          ENVIRONMENT: ${{ needs.environment.result }}
          INSTALL: ${{ needs.install.result }}
          REVIEW: ${{ needs.review.result }}
        run: |
          blocked=""
          for pair in "contract=$CONTRACT" "unit=$UNIT" "regression=$REGRESSION" "e2e=$E2E" "environment=$ENVIRONMENT" "install=$INSTALL"; do
            case "$pair" in
              *=success) ;;
              *) echo "::error::${pair%%=*}: ${pair#*=}, needs success"; blocked=1 ;;
            esac
          done
          case "$REVIEW:$ACTOR" in
            success:*|'skipped:dependabot[bot]') ;;
            *) echo "::error::review: $REVIEW, requires completion"; blocked=1 ;;
          esac
          if [ -n "$blocked" ]; then
            echo "## Merge: blocked, a job above is not green on this commit" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Arm the squash merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          live="$(gh pr view "$PR" --json state,isDraft,headRefOid,title,labels)"
          if ! jq -e --arg sha "$HEAD_SHA" '
            .state == "OPEN" and .isDraft == false and .headRefOid == $sha
            and (.title | ascii_downcase | contains("do not merge") | not)
            and ([.labels[].name | ascii_downcase] | all(. != "hold" and . != "do-not-merge"))
          ' <<<"$live" >/dev/null; then
            echo "::error::PR is closed, draft, held, or no longer at the tested head."
            exit 1
          fi
          # source: https://cli.github.com/manual/gh_pr_merge, --match-head-commit.
          gh pr merge "$PR" --auto --squash --match-head-commit "$HEAD_SHA"
          echo "## Merge: auto-merge armed for #$PR at $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"

  # Decision 1: the release gate of Cortex (.github/workflows/ci.yml, ADR-0802)
  # with the version read from ci.json's version_file. The tag is pushed over
  # the deploy key so the tag-triggered release workflows fire.
  tag:
    needs: [contract, unit, regression, e2e, environment, install]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-tag
      cancel-in-progress: false
    steps:
      - name: Guard, skip cleanly when RELEASE_TAG_SSH_KEY is missing
        id: guard
        env:
          SSH_KEY: ${{ secrets.RELEASE_TAG_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "RELEASE_TAG_SSH_KEY secret not configured, skipping."
            echo "Add the private half of a write-enabled repository deploy"
            echo "key at Settings -> Secrets and variables -> Actions."
            echo "has_deploy_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_deploy_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the SHA that just went green
        if: steps.guard.outputs.has_deploy_key == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_TAG_SSH_KEY }}

      - name: Set up Python
        if: steps.guard.outputs.has_deploy_key == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve the version and check for an existing tag
        id: tag_check
        if: steps.guard.outputs.has_deploy_key == 'true'
        env:
          VERSION_FILE: ${{ needs.contract.outputs.version_file }}
        run: |
          set -euo pipefail
          VERSION="$(python3 - "$VERSION_FILE" <<'PY'
          import json, sys, tomllib
          from pathlib import Path
          path = Path(sys.argv[1])
          if path.suffix == ".json":
              print(json.loads(path.read_text(encoding="utf-8"))["version"])
          else:
              doc = tomllib.loads(path.read_text(encoding="utf-8"))
              print((doc.get("project") or doc["package"])["version"])
          PY
          )"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "tag v${VERSION} already exists, this push carries no version bump"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "no existing tag v${VERSION}, this push is a version bump"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.guard.outputs.has_deploy_key == 'true' && steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push the release tag
        if: steps.guard.outputs.has_deploy_key == 'true' && steps.tag_check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.tag_check.outputs.version }}
        run: |
          set -euo pipefail
          git tag -a "v${VERSION}" -m "Release v${VERSION}" "${GITHUB_SHA}"
          git push origin "refs/tags/v${VERSION}"

      - name: Summarize the release-gate decision
        if: always()
        env:
          HAS_KEY: ${{ steps.guard.outputs.has_deploy_key }}
          EXISTS: ${{ steps.tag_check.outputs.exists }}
          VERSION: ${{ steps.tag_check.outputs.version }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "## Release gate: skipped, RELEASE_TAG_SSH_KEY not configured" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$EXISTS" = "true" ]; then
            echo "## Release gate: skipped, v${VERSION} already tagged (no version bump on this push)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Release gate: tagged v${VERSION} at \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
