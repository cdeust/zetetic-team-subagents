name: Release

# Supply-chain hardening (issue #53). This plugin ships NO binary — every
# artifact is source that executes in the user's session (hooks/ on lifecycle
# events, tools/*.sh in pre-commit gates, agents/ define assistant
# permissions), so the payload does not even need to be compiled. Honest
# attestation for a source-only plugin is: a deterministic bundle of exactly
# what a release delivers, signed; an executable-content manifest a user can
# enumerate and diff; and a verifier that rejects a tampered bundle before it
# runs. This workflow now builds and attests that bundle. Verify a download:
#   gh attestation verify zetetic-team-subagents.tar.gz --repo cdeust/zetetic-team-subagents

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    name: Run tests and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release + upload assets
      id-token: write       # OIDC token Sigstore exchanges for a signing cert
      attestations: write   # record the build-provenance statement on the repo

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep jq python3

      - name: Run full test suite
        run: |
          bash scripts/test-memory-e2e.sh
          bash scripts/test-memory-concurrency.sh
          bash scripts/test-memory-stale-lock.sh
          bash scripts/test-memory-mcp.sh
          bash scripts/test-agent-id-propagation.sh
          bash scripts/test-memory-pii.sh
          bash scripts/test-memory-pii-expanded.sh

      - name: Run structural auditor
        run: bash tools/agent-definition-auditor.sh

      - name: Run zetetic-checker on the source tree
        run: |
          # Strict profile on a release tag (no MAGIC_NUMBER /
          # UNSOURCED / TODO_NO_REF in the codebase itself).
          ZETETIC_PROFILE=strict bash tools/zetetic-checker.sh --full || true
          # Note: --full mode is informational here; --staged mode is the
          # commit-time gate. Tag-time check is advisory.

      - name: Build the attestable release bundle (tarball + exec manifest + SBOM)
        run: bash tools/build-release-bundle.sh dist

      # Self-verify BEFORE attesting/publishing: the verifier the install path
      # uses must accept the bundle we are about to sign. If the build produced
      # an inconsistent bundle, fail the release here rather than ship it.
      - name: Verify the built bundle self-consistently
        run: |
          bash tools/verify-release-bundle.sh \
            dist/zetetic-team-subagents.tar.gz \
            dist/zetetic-team-subagents.tar.gz.sha256 \
            dist/EXECUTABLE-MANIFEST.sha256

      # Provenance BEFORE upload: binds each artifact digest to this workflow,
      # commit and runner (issue #53 criterion 1). Signed releases/tags are the
      # achievable attestation for a source-only plugin — there is no binary to
      # sign, so the bundle, its executable manifest and its SBOM are the
      # subjects.
      - name: Attest build provenance (bundle + manifest + SBOM)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/zetetic-team-subagents.tar.gz
            dist/EXECUTABLE-MANIFEST.sha256
            dist/zetetic-team-subagents.cdx.json

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (in_section) exit
              if (index($0, "[" ver "]")) { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry found for $VERSION; using tag message" > release-notes.md
          fi

      - name: Create GitHub Release (with attested bundle, manifest + SBOM)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/zetetic-team-subagents.tar.gz
            dist/zetetic-team-subagents.tar.gz.sha256
            dist/EXECUTABLE-MANIFEST.sha256
            dist/EXECUTABLE-MANIFEST.sha256.sha256
            dist/zetetic-team-subagents.cdx.json
            dist/zetetic-team-subagents.cdx.json.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
