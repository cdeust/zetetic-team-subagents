name: ShellCheck

# Issue #53 criterion 5. hooks/ and tools/ are the session-executing surface —
# these scripts run on every commit in every repo that installs this plugin, and
# they were unlinted in CI. shellcheck is the language-appropriate static
# analysis for shell (CodeQL has no shell support — codeql.yml covers the .py
# hooks/tools instead; this is the honest split, stated rather than left as a
# gap).
#
# On a SCHEDULE as well as PR: a new shellcheck release recognises a new class
# against code that has not changed, and the weekly cron is what catches it.
# The version is PINNED (see SHELLCHECK_VERSION below), so that only happens
# when this file is edited — a scheduled run cannot silently change the gate's
# definition of a finding under a tree that did not move.
#
# Gate shape follows this repo's own ratchet convention (see ci.yml
# craftsmanship/redaction jobs), and the ratchet has now closed: error severity
# has been at zero since #53, and issue #74 dispositioned the whole
# warning-severity backlog (26 findings measured at 0.11.0 — 19 SC2034 from eval
# indirection the linter cannot follow, plus SC2164/SC2155/SC2154/SC2038/SC2010),
# each fixed or documented at its use site. Both severities are therefore HARD
# gates here. A gate that can be green today should be a gate, not a report: an
# informational sweep printing ~30 findings is how the backlog accumulated.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 3"   # Wednesdays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  # PINNED so the finding set is reproducible. `apt-get install shellcheck`
  # serves whatever the runner image happens to carry, which is how the same
  # tree measured 31 findings on 2026-07-25 and 26 on 2026-07-27 (issue #74).
  # The checksum is the official release asset digest reported by the GitHub
  # release API for this tag, verified against an independent download on
  # 2026-07-28.
  # source: https://github.com/koalaman/shellcheck/releases/tag/v0.11.0
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"

jobs:
  shellcheck:
    name: shellcheck hooks/ + tools/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned binary from the upstream release, checksum-verified before it is
      # unpacked, rather than the distro package. Fails closed: a digest
      # mismatch aborts the job instead of falling back to an unpinned copy.
      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }} (pinned, checksum-verified)
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSL --retry 3 --max-time 180 -o /tmp/shellcheck.tar.xz "$url"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          installed="$(shellcheck --version | awk '/^version:/ {print $2}')"
          if [[ "$installed" != "${SHELLCHECK_VERSION}" ]]; then
            echo "FATAL: expected shellcheck ${SHELLCHECK_VERSION}, got '${installed}'" >&2
            exit 1
          fi
          echo "shellcheck ${installed} installed and verified."

      # HARD gate: error-severity across every shell script in hooks/ and
      # tools/. No "|| true" — a real error fails the job.
      - name: ShellCheck (error severity — hard gate)
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find hooks tools -type f -name "*.sh" -print0)
          printf 'Hard-gating %d shell files at error severity:\n' "${#files[@]}"
          shellcheck -S error "${files[@]}"

      # HARD gate: warning severity, at zero as of issue #74. Promoted from the
      # informational sweep it used to be, matching how the error-severity gate
      # and the redaction sweep were tightened once their trees reached zero.
      - name: ShellCheck (warning severity — hard gate)
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find hooks tools -type f -name "*.sh" -print0)
          printf 'Hard-gating %d shell files at warning severity:\n' "${#files[@]}"
          shellcheck -S warning "${files[@]}"
