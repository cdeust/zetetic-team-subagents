# Upstream identity conformance.
#
# The codebase-intelligence MCP server was renamed twice (automatised-pipeline
# -> ai-architect-codebase -> ai-architect-mcp-codebase). The host derives a
# tool name as mcp__plugin_<plugin>_<server>__<tool> and silently DROPS a name
# it cannot resolve, so a stale prefix costs every agent its code intelligence
# without a single error line. In 2026-08 this repo carried 171 such lines
# across 122 files while CI stayed green, because the auditor's own allowlist
# had been hand-copied and carried the dead spelling too.
#
# This job removes the hand-copy. The producer publishes mcp-contract.json as
# the machine source of truth; we read it and derive, never restate.
#
# The URL is pinned to a full commit SHA on purpose: the producer's README is
# explicit that tags can be moved, so a tag pin is not an immutable pin.
name: Upstream identity

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catches a revocation published upstream between our commits.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  contract:
    name: conform to the upstream identity contract
    runs-on: ubuntu-latest
    env:
      CONTRACT_URL: https://raw.githubusercontent.com/cdeust/ai-architect-mcp-codebase/37728cc5747cebe39ea9d4011b7424de90f0a57b/mcp-contract.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the pinned identity contract
        run: |
          set -euo pipefail
          # Outside the working tree on purpose: the contract lists the revoked
          # prefixes, so downloading it into the repo would make the scan below
          # find them in the file it just wrote.
          curl --fail --location --silent --show-error \
               --connect-timeout 5 --max-time 30 --retry 2 \
               "$CONTRACT_URL" -o "$RUNNER_TEMP/contract.json"
          jq -e '.schema_version == 1' "$RUNNER_TEMP/contract.json" > /dev/null \
            || { echo "::error::unsupported contract schema_version"; exit 1; }

      - name: Derive the tool prefix rather than restating it
        run: |
          set -euo pipefail
          contract="$RUNNER_TEMP/contract.json"
          plugin=$(jq -r '.claude_plugin' "$contract")
          server=$(jq -r '.mcp_server' "$contract")
          published=$(jq -r '.claude_tool_prefix' "$contract")
          derived="mcp__plugin_${plugin}_${server}__"
          if [ "$published" != "$derived" ]; then
            echo "::error::contract is internally inconsistent: published '$published' != derived '$derived'"
            exit 1
          fi
          echo "EXPECTED_PREFIX=$derived" >> "$GITHUB_ENV"
          echo "Upstream canonical prefix: $derived"

      - name: Reject every revoked prefix
        run: |
          set -euo pipefail
          status=0
          while read -r revoked; do
            # A line may keep a revoked spelling on purpose (historical record,
            # a fixture that must contain it). It must say so explicitly.
            # -e carries the pattern so no `--` is needed: `--` would end option
            # parsing and turn the --exclude-dir flags into path operands.
            hits=$(grep -rn --binary-files=without-match \
                     --exclude-dir=.git --exclude-dir=.github \
                     -e "$revoked" . \
                   | grep -v 'identity-allow-legacy' || true)
            if [ -n "$hits" ]; then
              echo "::error::revoked upstream prefix still present: $revoked"
              printf '%s\n' "$hits"
              status=1
            fi
          done < <(jq -r '.revoked_claude_tool_prefixes[]' "$RUNNER_TEMP/contract.json")
          exit $status

      - name: The canonical prefix must actually be used
        run: |
          set -euo pipefail
          # Guards against the opposite failure: a repo that removed the stale
          # spelling without adopting the current one still calls nothing.
          count=$(grep -rl --binary-files=without-match \
                    --exclude-dir=.git --exclude-dir=.github \
                    -e "$EXPECTED_PREFIX" . | wc -l | tr -d ' ')
          echo "files naming the canonical prefix: $count"
          [ "$count" -gt 0 ] || {
            echo "::error::no file names $EXPECTED_PREFIX; the agents lost their code intelligence"
            exit 1
          }

      - name: The auditor allowlist must match the contract
        run: |
          set -euo pipefail
          # The auditor is what turns a stale prefix into a failing gate. If its
          # allowlist drifts from the contract, it certifies the dead spelling —
          # which is exactly how the 2026-08 drift stayed invisible.
          grep -q -- "$EXPECTED_PREFIX" tools/agent-definition-auditor.sh || {
            echo "::error::tools/agent-definition-auditor.sh does not allow $EXPECTED_PREFIX"
            exit 1
          }
