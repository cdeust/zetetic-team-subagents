name: Pipeline after merge

# GitHub rejects a workflow listening to itself (run40017492191).
# The local reusable retains this caller's workflow_run event context.
# https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#github-context
on:
  workflow_run:
    workflows: [Pipeline]
    types: [completed]
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  pipeline:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
    # A caller grants every permission used by its reusable jobs, even skipped
    # jobs. The callee narrows each job's permissions; no caller concurrency.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: ./.github/workflows/pipeline.yml
    secrets: inherit
