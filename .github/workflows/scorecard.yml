name: OpenSSF Scorecard

# Issue #53 criterion 6. zetetic-team-subagents adopts the ecosystem's single
# Scorecard definition as a CALL SITE, not a copy: the reusable workflow lives
# in cdeust/ai-architect-mcp-codebase (AP #66/#77). There is a fitting symmetry here
# — this repo hosts rules/coding-standards.md, the standard every other repo's
# supply-chain work is measured against, so it should not be the one asserting
# its posture instead of showing it.
#
# The first score is a BASELINE recorded as-is (§8); it deliberately does not
# gate a PR — a contributor cannot fix repo-level policy inside their diff.

on:
  schedule:
    - cron: "0 7 * * 2"   # Tuesdays 07:00 UTC — posture drifts by inaction
  branch_protection_rule:
  push:
    branches: [main]
  workflow_dispatch:

# REVERSAL NOTE (post-merge fix, issue #53): the call-site pattern
# (uses: cdeust/ai-architect-mcp-codebase/.../scorecard.yml@main) produced
# startup_failure on main — zero jobs spawned — and scorecard-action's
# publish_results requires the OIDC subject to be THIS repo's own
# default-branch workflow, so a cross-repo reusable call cannot publish
# even when it starts. In-repo canonical template instead; the pinned
# SHAs below match the AP definition and drift is caught by Scorecard
# itself flagging unpinned/stale actions. This workflow only runs on
# main/schedule, so PR CI could not have caught the failure: verified
# post-merge via workflow_dispatch.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # publish signed results to the OpenSSF API
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
