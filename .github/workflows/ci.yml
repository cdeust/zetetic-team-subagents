name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-memory-suites:
    name: Memory Tool Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ripgrep (used by search command)
        run: sudo apt-get update && sudo apt-get install -y ripgrep jq

      - name: Run e2e suite
        run: bash scripts/test-memory-e2e.sh

      - name: Run concurrency suite
        run: bash scripts/test-memory-concurrency.sh

      - name: Run stale-lock suite
        run: bash scripts/test-memory-stale-lock.sh

      - name: Run MCP suite
        run: bash scripts/test-memory-mcp.sh

      - name: Run agent-id propagation suite
        run: bash scripts/test-agent-id-propagation.sh

      - name: Run PII suite
        run: bash scripts/test-memory-pii.sh

      - name: Run PII expanded suite
        run: bash scripts/test-memory-pii-expanded.sh

  pytest:
    name: Python Suite + Coverage Gate (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # From requirements-dev.lock, not an inline list and not the .txt: the
      # first run of this job failed because PyYAML was missing
      # (tools/acceptance_gate.py and tools/semantic_layer.py import it at
      # module load), which an inline list would let drift again. One file,
      # installed by CI and by a contributor.
      #
      # --require-hashes against the generated .lock, because an unhashed
      # install is not pinned at all: requirements-dev.txt names PyYAML,
      # certifi, pytest and coverage with no version and no hash, so every run
      # resolved to whatever the index served that minute and any of the four
      # could have been swapped without a diff here. Reported as
      # code-scanning alert #40 (Scorecard Pinned-Dependencies,
      # "pipCommand not pinned by hash").
      #
      # requirements-dev.txt stays the human-edited input; the .lock is
      # generated from it and is the only thing installed. Regenerate with:
      #   uv pip compile requirements-dev.txt --generate-hashes --universal \
      #       --python-version 3.12 -o requirements-dev.lock
      # --universal so the markers cover every platform, not just the machine
      # that ran the compile.
      # uv arrives via the SHA-pinned action rather than `pip install uv`: a
      # bare version specifier is exactly the finding this step exists to
      # close, so installing the pinning tool that way would mint a second
      # alert in the commit that closes the first.
      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # requirements-dev.txt stopped being what gets installed the moment the
      # .lock did, so editing it alone would now change nothing and say
      # nothing — a silent no-op is worse than the unpinned install this
      # replaced. Recompile and diff: if the two disagree, fail here and name
      # the command that fixes it.
      - name: Check the lock matches requirements-dev.txt
        run: |
          uv pip compile requirements-dev.txt --generate-hashes --universal \
            --python-version 3.12 -o /tmp/requirements-dev.check >/dev/null 2>&1
          # Ignore only the header, which records the -o path and so always
          # differs; every requirement and hash line must match exactly.
          if ! diff -u \
              <(grep -v '^#' requirements-dev.lock) \
              <(grep -v '^#' /tmp/requirements-dev.check); then
            echo "::error::requirements-dev.lock disagrees with requirements-dev.txt." \
                 "Regenerate: uv pip compile requirements-dev.txt --generate-hashes" \
                 "--universal --python-version 3.12 -o requirements-dev.lock"
            exit 1
          fi
          echo "lock matches requirements-dev.txt"

      - name: Install test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes -r requirements-dev.lock

      - name: Run pinned OpenAI Codex validators on the packaged skill
        run: |
          bash tools/run-codex-validators.sh \
            plugins/zetetic-reasoning \
            plugins/zetetic-reasoning/skills/evidence-synthesis
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check generated portable references are current
        run: python3 tools/sync-portable-references.py --check

      - name: Load the skill from Codex and Gemini host layouts
        run: >-
          python -m pytest -q tests/test_portable_package.py
          -k codex_and_gemini_host_layouts_load_the_complete_skill

      # HARD gate. Before issue #71 the four suites under tests/ ran NOWHERE in
      # CI (`grep -rn pytest .github/` returned nothing), so a change that broke
      # all of them landed green. pyproject.toml declared testpaths for a runner
      # nothing called.
      #
      # Coverage runs in the SAME step as the suite because a coverage number
      # measured from a different invocation than the one that gates is not a
      # measurement of the gated thing. Scope, exclusions and the fail_under
      # floor are declared in pyproject.toml, so CI and a local run cannot
      # diverge — there are no --source or --fail-under flags here on purpose.
      - name: Run pytest under coverage
        run: python -m coverage run -m pytest -q

      # `coverage report` exits non-zero below fail_under (80, over hooks/ +
      # tools/). Verified to bite: raising the bar to 100 against the measured
      # 99% exits 2. No "|| true" — that is the whole point of this job.
      - name: Enforce the coverage floor
        run: python -m coverage report

  agent-audit:
    name: Agent Definition Auditor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run structural auditor
        run: bash tools/agent-definition-auditor.sh

  worktree-tests:
    name: Worktree Manager Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run sweep-safety suite (issue #33)
        run: bash scripts/test-worktree-sweep-safety.sh

  zetetic-checker:
    name: Zetetic Standard Checker (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # BLOCKING. The checker prints "FAILED: N blocking violation(s)" and exits
      # non-zero; swallowing that with `|| echo ... (informational)` produced a
      # green build over 9 self-declared blocking violations, which is worse
      # than having no gate at all: it reports compliance that was never checked.
      - name: Run zetetic-checker on full tree
        run: ZETETIC_PROFILE=standard bash tools/zetetic-checker.sh --full

  craftsmanship-checker:
    name: Craftsmanship Checker (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install ripgrep and jq
        run: sudo apt-get update && sudo apt-get install -y ripgrep jq

      # RATCHET: the hard gate runs on newly-ADDED files in the diff, not the full
      # tree. The legacy tree carries pre-existing §4 violations that are out of
      # scope for an incremental change; gating the whole tree (or every modified
      # legacy file) would guarantee a red build. New files must meet the standard —
      # the ratchet tightens without rewriting history. Base ref is the PR base SHA
      # for pull_request, or HEAD^ for a push (HEAD on the first commit, no parent).
      - name: Determine base ref for the diff
        id: base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${PR_BASE_SHA}" ]]; then
            base="${PR_BASE_SHA}"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "Diff base: ${base}"

      # HARD gate: no "|| echo" — a real violation in a NEWLY-ADDED file fails the
      # job. Scope is --diff-filter=A (added files only): every NEW file must fully
      # comply, while MODIFIED legacy files (which carry pre-existing §4 debt the
      # ratchet must not red-build on the moment they are touched) are surfaced by
      # the informational --full step below. This is the honest ratchet for a repo
      # with legacy debt: new code is held to the standard; legacy debt is reported,
      # not blocked, until it is refactored. (Tracked follow-up: bring the legacy
      # offenders — scripts/setup.sh 698L, stop-context-guard.py, etc. — into §4
      # compliance, then widen this gate to modified files.)
      - name: Craftsmanship hard gate on newly-added files
        run: |
          set -euo pipefail
          added=()
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            [[ -f "$f" ]] && added+=("$f")
          done < <(git diff --name-only --diff-filter=A "${{ steps.base.outputs.base }}" HEAD)
          if [[ ${#added[@]} -eq 0 ]]; then
            echo "No newly-added files to gate — passing."
            exit 0
          fi
          printf 'Hard-gating newly-added files (new files must fully comply):\n'
          printf '  %s\n' "${added[@]}"
          bash tools/craftsmanship-checker.sh --files "${added[@]}"

      # INFORMATIONAL: full-tree sweep that NEVER fails the job (mirrors the
      # informational zetetic-checker job above). Surfaces the legacy backlog
      # without blocking the build.
      - name: Run craftsmanship-checker on full tree (informational)
        run: bash tools/craftsmanship-checker.sh --full || echo "craftsmanship --full reported violations (informational; legacy tree)"

  deletion-gate:
    name: Deletion Gate (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # HARD gate, full-tree — not a ratchet: this is Tier 3 of the deletion
      # gate (tools/deletion_gate.py). Tier 1 (hooks/pre-tool-deletion-gate.py,
      # a PreToolUse hook) catches the pattern at edit time inside a session;
      # this job is the branch-protecting backstop for anything that reaches a
      # commit by another path — a scripted/bulk delete, a merge, a commit made
      # outside this harness. Base ref is the PR base SHA for pull_request, or
      # HEAD^ for a push (HEAD on the first commit, no parent) — same
      # determination as the craftsmanship job above, computed independently
      # here so this job has no cross-job dependency.
      #
      # Incident (source: cdeust/cortex-viz commit 45d4a80): three
      # module-level forwarders were removed and justified as "never had a
      # caller in this repository's history" — they had four. A grep for the
      # removed names against the post-change tree would have found them.
      # This gate is that grep, made mandatory: a removed top-level
      # definition either has no surviving caller AND a substantive
      # Retired-Because: trailer, or is a detected rename/move, or the build
      # is red.
      - name: Determine base ref for the diff
        id: base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${PR_BASE_SHA}" ]]; then
            base="${PR_BASE_SHA}"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "Diff base: ${base}"

      - name: No removed definition ships with a dangling caller or an unexplained deletion
        run: >-
          bash tools/deletion-gate.sh --repo .
          --base "${{ steps.base.outputs.base }}" --head HEAD

  doc-commands:
    name: Documented Commands Exist (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # HARD gate from the first commit, not a ratchet: the tree was MEASURED at
      # zero the moment issue #73's four stale commands were fixed, so there is
      # no legacy backlog to report-only around. CONTRIBUTING.md told every new
      # contributor to run five scripts that did not exist, and nothing noticed
      # because nothing checked.
      - name: Install jq (used to count hook registrations)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Every documented command names a file that exists
        run: bash tools/doc-command-check.sh

      # HARD gate: every number README, CONTRIBUTING and marketplace.json state
      # about this project is recomputed from the tree. The convention the
      # commands implement is docs/COUNTING.md. Four files previously gave four
      # different totals and none matched the tree (issue #72), and one of those
      # discrepancies had already been written down in memory/scope-coverage.md
      # and then re-accumulated, because noticing is not measuring.
      - name: Every documented count matches the tree
        run: bash tools/doc-count-check.sh

  changelog-commit-check:
    name: Changelog Commit Coverage (hard gate)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: the check walks `git log <latest-tag>..HEAD` and needs
      # every tag plus the full commit range since it, not the default shallow
      # clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # HARD gate, added after v2.37.0's own release postmortem: 14 of the 30
      # commits since v2.36.0 had no CHANGELOG.md entry, because nothing
      # measured the gap once the Unreleased section stopped being touched
      # per-PR. Every feat:/fix:/sec:/perf: commit since the latest tag must
      # be cited by its PR number somewhere above that tag's own section
      # header.
      - name: Every user-visible commit since the latest tag is in CHANGELOG.md
        run: bash tools/changelog-commit-check.sh

  redaction-sweep:
    name: Redaction Sweep (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # HARD gate on the FULL tree, not an added-files ratchet. The craftsmanship
      # job ratchets because its legacy §4 debt is a real refactoring backlog;
      # copy debt was different — it was ~190 findings that no one had measured,
      # because the checker cost minutes to run (12 subprocesses per line) and so
      # was never swept. Both were fixed together in issue #56: the checker is now
      # ~6s tree-wide and the tree is at ZERO. A gate that can be green today
      # should be a gate, not a report — a sweep that always prints ~200 findings
      # trains everyone to ignore it, which is how the backlog accumulated.
      #
      # strict promotes findings to exit 1; the default profile is warn-only by
      # design so a local run never blocks a commit on prose judgment.
      - name: Redaction check on all reader-facing copy
        run: ZETETIC_PROFILE=strict bash tools/redaction-checker.sh --full

  tools-tests:
    name: Tools Regression Suite (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install ripgrep and jq
        run: sudo apt-get update && sudo apt-get install -y ripgrep jq

      # node is required by tools/tests/adversarial-verify (deterministic synthesis-core
      # harness). Pinned rather than relying on the runner's preinstalled node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      # Orphan check (issue #93): a run-tests.sh nested deeper than
      # tools/tests/<suite>/run-tests.sh matches neither this job's glob below
      # nor tests/run-all.sh's, and would silently never run. tests/run-all.sh
      # --list runs that comparison and exits 2 on a mismatch; fail here with
      # an explicit message rather than downstream via doc-count-check's DRIFT.
      - name: Check for orphaned tools/tests suites
        run: bash tests/run-all.sh --list > /dev/null

      # HARD gate: run every tools/tests/*/run-tests.sh; fail the job on the
      # first non-zero exit. set -e propagates the failure (no "|| echo").
      - name: Run tools/tests regression suites
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(tools/tests/*/run-tests.sh)
          if [[ ${#suites[@]} -eq 0 ]]; then
            echo "no tools/tests/*/run-tests.sh suites found" >&2
            exit 1
          fi
          for suite in "${suites[@]}"; do
            echo "=== Running $suite ==="
            bash "$suite"
          done
