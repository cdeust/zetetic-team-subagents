name: Workflow definition API capability
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  actions: read
jobs:
  workflow-definition-api:
    runs-on: ubuntu-latest
    steps:
      - name: Verify scoped executed-file and public Contents capability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'API_PROBE'
          import json
          import os
          import re
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          class PostMergeError(Exception):
              """The event cannot authorize a protected merge or a tested commit."""


          class GitHub:
              def __init__(self, token: str):
                  if not token:
                      raise PostMergeError("GH_TOKEN is required")
                  self.token = token

              def request(self, method: str, path: str, body=None):
                  request = Request(
                      "https://api.github.com" + path,
                      data=json.dumps(body).encode("utf-8") if body is not None else None,
                      method=method,
                      headers={
                          "Authorization": "Bearer " + self.token,
                          "Accept": "application/vnd.github+json",
                          "Content-Type": "application/json",
                      },
                  )
                  try:
                      with urlopen(request) as response:
                          return json.load(response)
                  except HTTPError as exc:
                      # Never print headers or the untrusted response body.
                      raise PostMergeError(f"GitHub {method} {path}: HTTP {exc.code}") from exc
                  except (URLError, ValueError) as exc:
                      raise PostMergeError(
                          f"GitHub {method} {path}: unreadable response"
                      ) from exc

              def records(self, path: str, key: str | None = None):
                  # Pagination only, not retries or polling. REST per_page maximum is 100.
                  # https://docs.github.com/en/rest/using-the-rest-api/using-pagination-in-the-rest-api
                  page = 1
                  while True:
                      separator = "&" if "?" in path else "?"
                      data = self.request("GET", f"{path}{separator}per_page=100&page={page}")
                      rows = data.get(key) if key and isinstance(data, dict) else data
                      if not isinstance(rows, list):
                          raise PostMergeError("GitHub returned an invalid record list")
                      yield from rows
                      if len(rows) < 100:
                          return
                      page += 1


          RUN_FILE_QUERY = 'query($id: ID!) {\n  node(id: $id) { ... on WorkflowRun {\n    databaseId runAttempt\n    file { path repositoryName repositoryFileUrl }\n  } }\n}'

          def main():
              api = GitHub(os.environ['GH_TOKEN'])
              repository = os.environ['GITHUB_REPOSITORY']
              identity = int(os.environ['GITHUB_RUN_ID'])
              attempt = int(os.environ['GITHUB_RUN_ATTEMPT'])
              run = api.request('GET', f'/repos/{repository}/actions/runs/{identity}')
              reply = api.request('POST', '/graphql', {
                  'query': RUN_FILE_QUERY, 'variables': {'id': run['node_id']},
              })
              if reply.get('errors'):
                  raise PostMergeError('GraphQL capability denied')
              node = reply['data']['node']
              file = node['file']
              if node['databaseId'] != identity or node['runAttempt'] != attempt:
                  raise PostMergeError('GraphQL run identity differs')
              expected = re.escape(repository) + r'/blob/[0-9a-f]{40}/' + re.escape('.github/workflows/workflow-definition-api.yml')
              if (file['repositoryName'] != repository
                      or file['path'] != '.github/workflows/workflow-definition-api.yml'
                      or re.fullmatch(r'https://github\.com/' + expected, file['repositoryFileUrl']) is None):
                  raise PostMergeError('GraphQL executed-file identity differs')
              # This source repository is public. Use a DIFFERENT public repository to
              # measure actual cross-repository Contents access with this GITHUB_TOKEN.
              entry = api.request('GET', '/repos/cdeust/Cortex/contents/.github/workflows/pipeline.yml?ref=refs%2Fheads%2Fmain')
              if entry.get('type') != 'file' or re.fullmatch(r'[0-9a-f]{40}', entry.get('sha', '')) is None:
                  raise PostMergeError('Public Contents capability denied')
              print(f'workflow-definition-api: run={identity} attempt={attempt} GraphQL=ok public-contents-blob={entry["sha"]}')


          if __name__ == '__main__':
              try:
                  main()
              except (PostMergeError, ValueError, KeyError, TypeError, AttributeError, OSError):
                  # Never log API payloads, headers, token or raw exception text.
                  print('workflow-definition-api: capability validation failed')
                  raise SystemExit(1)
          API_PROBE
